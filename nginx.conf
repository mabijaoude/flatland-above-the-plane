# Only Vite's content-hashed bundles can be cached indefinitely. Public artwork,
# the book, and notices keep stable URLs and must be revalidated after a release.
map $uri $flatland_cache_control {
    default "no-cache";
    /index.html "no-cache, no-store, must-revalidate";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\\.(?:js|css|woff2?)$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $flatland_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(?:html|js|css|map|woff2?|glb|png|jpe?g|svg|ico|json|txt)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json font/woff2 model/gltf-binary text/css;
}
