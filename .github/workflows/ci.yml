name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.9.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release notices and dependency licenses
        run: pnpm check:release

      - name: Run tests
        run: pnpm test

      - name: Build production application
        run: pnpm build

      - name: Install browser for smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise the production build in a browser
        run: pnpm test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flatland-browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flatland-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
