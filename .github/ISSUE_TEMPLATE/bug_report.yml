name: Bug report
description: Report a reproducible problem in the simulation or interface.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to provide a reproducible report.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release tag, commit hash, or approximate date.
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 142 on Windows 11
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots, console output, or a minimal save-state description. Remove personal information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not disclose an unpatched security vulnerability.
          required: true
